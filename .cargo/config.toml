# Modified by Zephyr857857 on 2026-11-21 (upstream: qingjian-team/qingjian @ 996350c). See FORK.md.
# Windows 静态链接 CRT：Rust 缺省动态链 vcruntime140.dll，它不随 Windows 自带，
# 且 AppContainer 进程（任务栏搜索等）能否读到 System32 里那份取决于别的安装程序留下的 ACL，
# 读不到时 TSF DLL 整个加载失败、系统切回上一个输入法。静态链接后只依赖系统自带的 DLL。
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# 安卓 jemalloc：尖峰后空闲页尽快归还，压低输入法常驻 RSS。
# jemalloc-sys 在编译期把这个值写进 .so，运行期不用再导 malloc_conf 符号。
# decay 给 1 秒而非 0，避免打字过程中缓存被立刻清掉带来的抖动。
# 按 target 限定，别影响 Linux/macOS/Windows 的构建。
[target.aarch64-linux-android]
env = { JEMALLOC_SYS_WITH_MALLOC_CONF = "dirty_decay_ms:1000,muzzy_decay_ms:1000" }
